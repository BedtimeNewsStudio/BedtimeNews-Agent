<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>睡前消息知识库</title>
  <meta name="description" content="在同一处阅读睡前消息文稿，并随时向知识库 Agent 提问。" />
  <link rel="icon" type="image/webp" href="/bedtimenews.webp" />
  <script>
    // Set theme before first paint to avoid a flash.
    (function () {
      var root = document.documentElement;
      var systemTheme =
        !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      var preference = null;
      try {
        var q = new URLSearchParams(location.search).get("theme");
        preference = q === "light" || q === "dark" ? q : sessionStorage.getItem("theme");
        if (preference !== "light" && preference !== "dark") preference = null;
        if (q === "light" || q === "dark") sessionStorage.setItem("theme", q);
        localStorage.removeItem("theme");
      } catch (e) {
        console.warn("Theme storage is unavailable; using the system preference.", e);
      }
      root.dataset.theme = preference || systemTheme;
      root.dataset.themePreference = preference ? "user" : "system";
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body data-view="chat">
  <a class="skip-link" href="#app-shell">跳到主要内容</a>

  <header class="masthead">
    <a class="masthead-brand" href="/" data-route aria-label="返回首页">
      <img class="brand-logo" src="/bedtimenews.webp" alt="睡前消息" />
      <span class="wordmark-cn">睡前消息知识库</span>
    </a>

    <!-- Sections of the one archive, on the title's own line. Each channel is
         its own page, so there is no "everything" entry. Built by app.js from
         the transcript index; hidden until that arrives. -->
    <nav class="channel-bar" id="channel-bar" aria-label="栏目" hidden></nav>

    <div class="masthead-right">
      <nav class="masthead-links" aria-label="外部链接">
        <a class="mast-link mast-icon" href="https://github.com/BedtimeNewsStudio/BedtimeNews-Agent" target="_blank"
          rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库">
          <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" focusable="false" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
          </svg>
        </a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅主题">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="app-shell" id="app-shell" tabindex="-1">
    <section class="chat-pane" id="chat-pane" aria-label="知识库 Agent">
      <header class="chat-pane-head">
        <span>ASK THE ARCHIVE</span>
        <button class="chat-close" id="chat-close" type="button" aria-label="关闭 Agent 面板">×</button>
      </header>
      <div class="stage" id="stage">
        <section class="hero" id="hero">
          <div class="sample-section">
            <div class="sample-head">
              <span class="sample-title">示例提问</span>
              <p class="sample-lede">按主题浏览，或直接提问。</p>
              <button class="sample-reshuffle" id="sample-reshuffle" type="button" hidden>换一批</button>
            </div>
            <div class="sample-grid" id="sample-grid"></div>
          </div>
        </section>
        <section class="log" id="log"></section>
        <output class="sr-only" id="stream-status" aria-live="polite"></output>
      </div>

      <footer class="composer">
        <form class="composer-form" id="composer-form">
          <span class="composer-prompt" aria-hidden="true">&gt;</span>
          <label class="sr-only" for="composer-input">输入你的问题</label>
          <textarea id="composer-input" class="composer-input" rows="1" placeholder="输入你的问题，回车发送"
            autocomplete="off" spellcheck="false"></textarea>
          <button type="submit" class="composer-send" id="composer-send">
            发送<span class="send-arrow" aria-hidden="true">▸</span>
          </button>
        </form>
        <p class="composer-note"><span class="app-version" id="app-version" hidden></span>仅回答节目相关问题 · 刷新清空对话</p>
      </footer>
    </section>

    <!-- The archive and the reader share one pane: a window the chat pushes
         open rather than a page it navigates away to. Collapsed to zero width
         and inert while closed; app.js drives the rest. -->
    <aside class="reading-pane" id="reading-pane" aria-label="文稿" inert>
      <header class="reading-bar">
        <button class="reading-back" id="reading-back" type="button" aria-label="返回文稿列表" title="返回文稿列表"
          hidden>←</button>
        <p class="reading-bar-label" id="reading-bar-label"></p>
        <button class="reading-close" id="reading-close" type="button" aria-label="关闭文稿面板" title="关闭文稿面板">×</button>
      </header>
      <div class="reading-scroll" id="reading-scroll">
        <div class="content-pane">
          <section class="archive-view" id="archive-view" hidden aria-labelledby="archive-title">
            <header class="archive-head">
              <h1 id="archive-title"></h1>
              <input class="archive-search" id="archive-search" type="search" placeholder="输入标题或期号"
                aria-label="输入标题或期号" autocomplete="off" />
            </header>
            <div class="archive-groups" id="archive-groups"></div>
            <p class="archive-state" id="archive-state" role="status">正在接收文稿目录…</p>
          </section>

          <article class="reader-view" id="reader-view" hidden>
            <header class="reader-head">
              <h1 id="reader-title"></h1>
            </header>
            <div class="reader-body" id="reader-body"></div>
            <p class="reader-state" id="reader-state" role="status"></p>
          </article>
        </div>
      </div>
    </aside>
  </main>

  <button class="chat-fab" id="chat-fab" type="button" aria-controls="chat-pane" aria-expanded="false">问 Agent</button>

  <template id="tpl-query">
    <article class="turn turn-query">
      <div class="query-card">
        <span class="query-tag">查询</span>
        <p class="query-text"></p>
      </div>
    </article>
  </template>

  <template id="tpl-transmission">
    <article class="turn turn-transmission">
      <div class="signal" data-state="acquiring">
        <button type="button" class="signal-head" aria-expanded="true">
          <span class="signal-bar" aria-hidden="true"></span>
          <span class="signal-label">信号采集</span>
          <span class="signal-status">采集中…</span>
          <span class="signal-toggle" aria-hidden="true"></span>
        </button>
        <ol class="signal-stages">
          <li class="stage-item" data-stage="condense"><span class="stage-name">理解</span><span class="stage-line"></span></li>
          <li class="stage-item" data-stage="route"><span class="stage-name">路由</span><span class="stage-line"></span></li>
          <li class="stage-item" data-stage="rewrite"><span class="stage-name">优化</span><span class="stage-line"></span></li>
          <li class="stage-item" data-stage="retrieve"><span class="stage-name">检索</span><span class="stage-line"></span></li>
          <li class="stage-item" data-stage="grade"><span class="stage-name">评分</span><span class="stage-line"></span></li>
          <li class="stage-item" data-stage="generate"><span class="stage-name">生成</span><span class="stage-line"></span></li>
        </ol>
      </div>
      <div class="answer" hidden>
        <div class="answer-body"></div>
      </div>
    </article>
  </template>

  <script type="module" src="/app.js"></script>
</body>

</html>
