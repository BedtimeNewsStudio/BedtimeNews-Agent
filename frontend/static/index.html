<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>睡前消息知识库</title>
  <meta name="description" content="睡前消息知识库。检索全部节目文稿，给出有据可查的回答。" />
  <link rel="icon" type="image/webp" href="/bedtimenews.webp" />
  <script>
    // Set theme before first paint to avoid a flash.
    //
    // The override lives in sessionStorage, so a manual choice survives reloads
    // within a visit but every fresh arrival starts from the OS preference
    // again. Queried as `dark` to match app.js — asking the opposite question in
    // the two places would disagree on a browser that reports neither.
    (function () {
      var root = document.documentElement;
      var systemTheme =
        !window.matchMedia ||
          window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      var preference = null;

      try {
        var q = new URLSearchParams(location.search).get("theme");
        preference =
          q === "light" || q === "dark" ? q : sessionStorage.getItem("theme");
        if (preference !== "light" && preference !== "dark") {
          preference = null;
        }
        if (q === "light" || q === "dark") {
          sessionStorage.setItem("theme", q);
        }
        // The override used to be permanent; drop the stale key so it stops
        // showing up in devtools long after it lost any effect.
        localStorage.removeItem("theme");
      } catch (e) {
        // Storage may be unavailable, but the system preference still applies.
        console.warn("Theme storage is unavailable; using the system preference.", e);
      }

      root.dataset.theme = preference || systemTheme;
      root.dataset.themePreference = preference ? "user" : "system";
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <a class="skip-link" href="#composer-input">跳到提问框</a>

  <header class="masthead">
    <a class="masthead-brand" href="/" aria-label="返回首页">
      <img class="brand-logo" src="/bedtimenews.webp" alt="睡前消息" />
      <span class="wordmark-cn">睡前消息知识库</span>
    </a>
    <div class="masthead-right">
      <nav class="masthead-links" aria-label="外部链接">
        <a class="mast-link" href="https://archive.bedtime.news/" target="_blank" rel="noopener noreferrer">文稿</a>
        <a class="mast-link mast-icon" href="https://github.com/BedtimeNewsStudio/BedtimeNews-Agent" target="_blank"
          rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库">
          <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" focusable="false" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
          </svg>
        </a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅主题">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <!-- Empty state: sample questions -->
    <section class="hero" id="hero">
      <div class="sample-section">
        <div class="sample-head">
          <span class="sample-title">示例提问</span>
          <p class="sample-lede">按主题浏览，或直接提问。</p>
          <button class="sample-reshuffle" id="sample-reshuffle" type="button" hidden>换一批</button>
        </div>
        <div class="sample-grid" id="sample-grid">
          <!-- categories injected by app.js -->
        </div>
      </div>
    </section>

    <!-- Conversation log (populated after first query). Deliberately not a
         live region: streamed tokens would re-announce the whole answer on
         every update. Progress is announced via #stream-status instead. -->
    <section class="log" id="log"></section>
    <output class="sr-only" id="stream-status" aria-live="polite"></output>
  </main>

  <footer class="composer">
    <form class="composer-form" id="composer-form">
      <span class="composer-prompt" aria-hidden="true">&gt;</span>
      <label class="sr-only" for="composer-input">输入你的问题</label>
      <textarea id="composer-input" class="composer-input" rows="1" placeholder="输入你的问题，回车发送" autocomplete="off"
        spellcheck="false"></textarea>
      <button type="submit" class="composer-send" id="composer-send">
        发送<span class="send-arrow" aria-hidden="true">▸</span>
      </button>
    </form>
    <p class="composer-note"><span class="app-version" id="app-version" hidden></span>仅回答与睡前消息等节目内容相关的问题 ·
      刷新页面将清空本次对话</p>
  </footer>

  <!-- Templates -->
  <template id="tpl-query">
    <article class="turn turn-query">
      <div class="query-card">
        <span class="query-tag">查询</span>
        <p class="query-text"></p>
      </div>
    </article>
  </template>

  <template id="tpl-transmission">
    <article class="turn turn-transmission">
      <div class="signal" data-state="acquiring">
        <button type="button" class="signal-head" aria-expanded="true">
          <span class="signal-bar" aria-hidden="true"></span>
          <span class="signal-label">信号采集</span>
          <span class="signal-status">采集中…</span>
          <span class="signal-toggle" aria-hidden="true"></span>
        </button>
        <ol class="signal-stages">
          <li class="stage-item" data-stage="condense"><span class="stage-name">理解</span><span
              class="stage-line"></span></li>
          <li class="stage-item" data-stage="route"><span class="stage-name">路由</span><span class="stage-line"></span>
          </li>
          <li class="stage-item" data-stage="rewrite"><span class="stage-name">优化</span><span class="stage-line"></span>
          </li>
          <li class="stage-item" data-stage="retrieve"><span class="stage-name">检索</span><span
              class="stage-line"></span></li>
          <li class="stage-item" data-stage="grade"><span class="stage-name">评分</span><span class="stage-line"></span>
          </li>
          <li class="stage-item" data-stage="generate"><span class="stage-name">生成</span><span
              class="stage-line"></span></li>
        </ol>
      </div>
      <div class="answer" hidden>
        <div class="answer-body"></div>
      </div>
    </article>
  </template>

  <!-- markdown-it is loaded on demand by app.js, once a question is asked. -->
  <script type="module" src="/app.js"></script>
</body>

</html>
