# Local-only deterministic sample overlay on top of the umbrella file:
#   docker compose -f docker-compose.yml -f docker-compose.sample.yml up -d
# The services it overrides come from compose.data.yml / compose.app.yml via
# the umbrella's `include`; overrides apply to them as before. Set
# POSTGRES_DATA_DIR and INDEXER_DATA_DIR to isolated host directories before
# invoking Compose; the indexer's read-only /pgdata disk-precheck mount follows
# POSTGRES_DATA_DIR, so it watches the sample database's filesystem. The fixed
# container names below are fine for a single sample instance.
services:
  postgres:
    container_name: bedtimenews-sample-postgres
    environment:
      POSTGRES_DB: postgres_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user} -d postgres_local"]

  indexer:
    container_name: bedtimenews-sample-indexer
    environment:
      POSTGRES_DB: postgres_local
      INDEXER_SCOPE: sample
      INDEX_CONFIG_FILE: /app/index_config.sample.yml

  agent:
    container_name: bedtimenews-sample-agent
    environment:
      POSTGRES_DB: postgres_local

  web:
    container_name: bedtimenews-sample-web
    ports: !override
      - "${SAMPLE_FRONTEND_PORT:-18080}:8080"
