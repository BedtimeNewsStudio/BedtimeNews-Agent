name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: ruff

      # Install only the dev tooling group (ruff), not the component runtime
      # deps — linting needs nothing else. Uses the pinned version from uv.lock.
      - name: Install ruff
        run: uv sync --frozen --only-group dev

      - name: Run ruff check
        run: uv run --no-sync ruff check .

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    # Real PostgreSQL + pgvector for the snapshot build/publish and selection
    # tests (indexer/tests/test_pipeline.py, agent/tests/test_snapshots.py);
    # they create and drop their own throwaway databases.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGTEST_HOST: localhost
      PGTEST_PORT: "5432"
      PGTEST_USER: postgres
      PGTEST_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: pytest

      # Full env: tests import component modules, so component runtime deps
      # are needed in addition to the dev group (pytest).
      - name: Install dependencies
        run: uv sync --frozen

      # Each component is its own `src` namespace, so run pytest separately
      # per component (one process each) to avoid sys.modules collisions.
      - name: Run pytest per component
        run: |
          for d in agent indexer frontend; do
            if [ -d "$d/tests" ]; then
              echo "::group::pytest $d"
              (cd "$d" && uv run --no-sync pytest) || exit 1
              echo "::endgroup::"
            fi
          done
