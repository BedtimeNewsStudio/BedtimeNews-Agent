<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="360" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
  <title id="title">Frontend request architecture</title>
  <desc id="desc">Requests travel from the browser to the web frontend over plain HTTP on port 8080; the web service proxies /chat and the transcript APIs to the agent API. Server-sent events return on a parallel rail.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#e7eef9"/>
    </linearGradient>
    <linearGradient id="blue-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#29466f" flood-opacity=".12"/>
    </filter>
    <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#4a7df0"/>
    </marker>
    <marker id="soft-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#7e8ca8"/>
    </marker>
    <style>
      .canvas { fill:url(#canvas); stroke:#c4d0e6; stroke-width:2 }
      .node { fill:#ffffff; stroke:#c4d0e6; stroke-width:1.5; filter:url(#shadow) }
      .focus { fill:url(#blue-panel); stroke:#4a7df0 }
      .eyebrow { fill:#647089; font:400 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.1em }
      .label { fill:#0e1420; font:400 24px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .sub { fill:#46536b; font:400 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .request { fill:none; stroke:#4a7df0; stroke-width:3; marker-end:url(#blue-arrow) }
      .response { fill:none; stroke:#7e8ca8; stroke-width:2.5; marker-end:url(#soft-arrow) }
      .rail-label { fill:#647089; font:400 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.05em; text-anchor:middle }
      .dot { fill:#4a7df0 }
    </style>
  </defs>

  <rect class="canvas" x="4" y="4" width="1042" height="352" rx="28"/>
  <text class="eyebrow" x="44" y="47">BEDTIMENEWS / FRONTEND SIGNAL PATH</text>
  <circle class="dot" cx="44" cy="84" r="4"/>
  <line x1="56" y1="92" x2="1026" y2="92" stroke="#d9e2f2"/>

  <rect class="node" x="50" y="145" width="220" height="140" rx="18"/>
  <text class="label" x="160" y="203">Browser</text>
  <text class="sub" x="160" y="242">HTTP + EVENT STREAM</text>

  <rect class="node focus" x="400" y="145" width="220" height="140" rx="18"/>
  <text class="label" x="510" y="196">Web</text>
  <text class="sub" x="510" y="231">FASTAPI + STATIC UI</text>
  <text class="sub" x="510" y="260">HTTP · :8080</text>

  <rect class="node" x="750" y="145" width="250" height="140" rx="18"/>
  <text class="label" x="875" y="196">Agent API</text>
  <text class="sub" x="875" y="231">POST /CHAT</text>
  <text class="sub" x="875" y="260">INTERNAL :8000</text>

  <path class="request" d="M270 184H400"/>
  <path class="request" d="M620 184H750"/>
  <text class="rail-label" x="335" y="162">HTTP :8080</text>
  <text class="rail-label" x="685" y="162">JSON</text>

  <path class="response" d="M750 247H620"/>
  <path class="response" d="M400 247H270"/>
  <text class="rail-label" x="685" y="273">SSE</text>
  <text class="rail-label" x="335" y="273">EVENTS</text>
</svg>
