<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
  <title id="title">Indexer pipeline</title>
  <desc id="desc">The indexer synchronizes and scans the transcript repository, detects changed and deleted files, deletes stale records, and processes every added or modified file through load, chunk, embed, and durable database update stages.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#e7eef9"/>
    </linearGradient>
    <linearGradient id="blue-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#29466f" flood-opacity=".12"/>
    </filter>
    <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#4a7df0"/>
    </marker>
    <marker id="gold-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#f2c14e"/>
    </marker>
    <marker id="teal-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#35c7b1"/>
    </marker>
    <style>
      .canvas { fill:url(#canvas); stroke:#c4d0e6; stroke-width:2 }
      .group { fill:#eef4ff; stroke:#b7c9ed; stroke-width:1.5 }
      .node { fill:#ffffff; stroke:#c4d0e6; stroke-width:1.5; filter:url(#shadow) }
      .focus { fill:url(#blue-panel); stroke:#4a7df0 }
      .change { fill:#fff8e8; stroke:#b1770f }
      .database { fill:#edf9f6; stroke:#35a995 }
      .eyebrow { fill:#647089; font:400 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.1em }
      .group-label { fill:#2a5fe0; font:400 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.08em }
      .num { fill:#2a5fe0; font:400 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .label { fill:#0e1420; font:400 22px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .sub { fill:#46536b; font:400 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .mono { fill:#647089; font:400 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .blue-line { fill:none; stroke:#4a7df0; stroke-width:3; marker-end:url(#blue-arrow) }
      .gold-line { fill:none; stroke:#f2c14e; stroke-width:2.5; marker-end:url(#gold-arrow) }
      .teal-line { fill:none; stroke:#35c7b1; stroke-width:3; marker-end:url(#teal-arrow) }
      .edge-label { fill:#647089; font:400 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.03em; text-anchor:middle }
      .gold { fill:#9a6509 }
    </style>
  </defs>

  <rect class="canvas" x="4" y="4" width="1312" height="612" rx="28"/>
  <text class="eyebrow" x="42" y="47">BEDTIMENEWS / INDEXER RUN</text>
  <line x1="42" y1="92" x2="1278" y2="92" stroke="#d9e2f2"/>

  <text class="group-label" x="50" y="132">DISCOVER CHANGES</text>

  <rect class="node" x="50" y="160" width="230" height="120" rx="17"/>
  <text class="num" x="165" y="190">01</text>
  <text class="label" x="165" y="226">Sync repository</text>
  <text class="sub" x="165" y="257">clone or pull latest</text>

  <rect class="node focus" x="365" y="160" width="230" height="120" rx="17"/>
  <text class="num" x="480" y="190">02</text>
  <text class="label" x="480" y="226">Scan files</text>
  <text class="sub" x="480" y="257">apply include / exclude rules</text>

  <rect class="node change" x="680" y="160" width="230" height="120" rx="17"/>
  <text class="num" x="795" y="190">03</text>
  <text class="label" x="795" y="226">Detect changes</text>
  <text class="sub" x="795" y="257">ADD · MODIFY · DELETE</text>

  <rect class="node database" x="995" y="160" width="275" height="120" rx="17"/>
  <text class="mono" x="1132.5" y="190">DELETE PATH</text>
  <text class="label" x="1132.5" y="226">Remove stale data</text>
  <text class="sub" x="1132.5" y="257">chunks + indexing history</text>

  <path class="blue-line" d="M280 220H365"/>
  <path class="blue-line" d="M595 220H680"/>
  <path class="gold-line" d="M910 220H995"/>
  <text class="edge-label gold" x="952.5" y="196">DELETE</text>

  <rect class="group" x="50" y="365" width="1220" height="205" rx="22"/>
  <text class="group-label" x="225" y="403">EACH ADDED OR MODIFIED FILE · COMMIT BEFORE THE NEXT FILE</text>

  <rect class="node focus" x="78" y="435" width="230" height="110" rx="16"/>
  <text class="num" x="193" y="463">04</text>
  <text class="label" x="193" y="499">Load document</text>
  <text class="sub" x="193" y="528">parse Markdown</text>

  <rect class="node" x="383" y="435" width="230" height="110" rx="16"/>
  <text class="num" x="498" y="463">05</text>
  <text class="label" x="498" y="499">Chunk</text>
  <text class="sub" x="498" y="528">semantic sections</text>

  <rect class="node" x="688" y="435" width="230" height="110" rx="16"/>
  <text class="num" x="803" y="463">06</text>
  <text class="label" x="803" y="499">Embed</text>
  <text class="sub" x="803" y="528">batched embedding API</text>

  <rect class="node database" x="993" y="435" width="250" height="110" rx="16"/>
  <text class="num" x="1118" y="463">07</text>
  <text class="label" x="1118" y="499">Commit update</text>
  <text class="sub" x="1118" y="528">chunks + audit + history</text>

  <path class="blue-line" d="M308 490H383"/>
  <path class="blue-line" d="M613 490H688"/>
  <path class="teal-line" d="M918 490H993"/>
  <path class="blue-line" d="M795 280V316Q795 332 779 332H193Q173 332 173 352V435"/>
  <rect x="405" y="310" width="240" height="40" rx="20" fill="#f6f9fd" stroke="#b7c9ed"/>
  <text class="edge-label" x="525" y="335">ADD / MODIFY</text>
</svg>
