<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="650" viewBox="0 0 1296 650" role="img" aria-labelledby="title desc">
  <title id="title">BedtimeNews system architecture</title>
  <desc id="desc">The request plane runs from the browser over plain HTTP (port 8080) through the web frontend to the agent, which reads PostgreSQL read-only as the rag_agent role, one snapshot per request. The content plane runs from the transcript archive through the indexer, the only writer, which builds each update as an immutable snapshot schema rag_s&lt;id&gt; (chunks, vectors, transcripts) and publishes it atomically in the rag_meta registry; rag_state holds the indexer's audit log.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#e7eef9"/>
    </linearGradient>
    <linearGradient id="blue-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2a5fe0" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#29466f" flood-opacity=".12"/>
    </filter>
    <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#4a7df0"/>
    </marker>
    <marker id="teal-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#35c7b1"/>
    </marker>
    <style>
      .canvas { fill:url(#canvas); stroke:#c4d0e6; stroke-width:2 }
      .grid { fill:url(#grid) }
      .node { fill:#ffffff; stroke:#c4d0e6; stroke-width:1.5; filter:url(#shadow) }
      .focus { fill:url(#blue-panel); stroke:#4a7df0 }
      .database { fill:#edf9f6; stroke:#35a995 }
      .archive { fill:#fff8e8; stroke:#b1770f }
      .eyebrow { fill:#647089; font:400 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.1em }
      .lane { fill:#647089; font:400 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.1em }
      .label { fill:#0e1420; font:400 24px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .sub { fill:#46536b; font:400 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .mono { fill:#647089; font:400 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .blue-line { fill:none; stroke:#4a7df0; stroke-width:3; marker-end:url(#blue-arrow) }
      .teal-line { fill:none; stroke:#35c7b1; stroke-width:3; marker-end:url(#teal-arrow) }
      .edge-label { fill:#647089; font:400 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle }
      .tick { stroke:#4a7df0; stroke-width:2 }
    </style>
  </defs>

  <rect class="canvas" x="4" y="4" width="1288" height="642" rx="28"/>
  <rect class="grid" x="5" y="5" width="1286" height="640" rx="27"/>

  <text class="eyebrow" x="44" y="47">BEDTIMENEWS / SYSTEM MAP</text>
  <circle cx="1042" cy="42" r="4" fill="#4a7df0"/>
  <text class="eyebrow" x="1055" y="47">REQUEST</text>
  <circle cx="1150" cy="42" r="4" fill="#35c7b1"/>
  <text class="eyebrow" x="1163" y="47">DATA</text>

  <text class="lane" x="44" y="103">REQUEST PLANE</text>
  <line x1="188" y1="99" x2="1240" y2="99" stroke="#d9e2f2"/>
  <text class="lane" x="44" y="413">CONTENT PLANE</text>
  <line x1="188" y1="409" x2="1240" y2="409" stroke="#d9e2f2"/>

  <rect class="node" x="50" y="165" width="200" height="130" rx="17"/>
  <line class="tick" x1="70" y1="184" x2="100" y2="184"/>
  <text class="label" x="150" y="222">Browser</text>
  <text class="sub" x="150" y="256">reader</text>

  <rect class="node focus" x="370" y="165" width="230" height="130" rx="17"/>
  <text class="label" x="485" y="222">Web frontend</text>
  <text class="sub" x="485" y="256">FastAPI + static UI</text>

  <rect class="node" x="690" y="165" width="210" height="130" rx="17"/>
  <text class="label" x="795" y="222">Agent</text>
  <text class="sub" x="795" y="256">LangGraph · :8000</text>
  <text class="mono" x="795" y="282">one snapshot per request</text>

  <rect class="node database" x="990" y="165" width="240" height="410" rx="20"/>
  <text class="mono" x="1110" y="201">VERSIONED SNAPSHOTS</text>
  <text class="label" x="1110" y="241">PostgreSQL</text>
  <text class="sub" x="1110" y="275">+ pgvector</text>
  <line x1="1022" y1="300" x2="1198" y2="300" stroke="#35c7b1" stroke-opacity=".35"/>
  <text class="sub" x="1110" y="334">rag_s&lt;id&gt; · read-only</text>
  <text class="mono" x="1110" y="360">chunks · vectors · transcripts</text>
  <line x1="1022" y1="384" x2="1198" y2="384" stroke="#35c7b1" stroke-opacity=".2"/>
  <text class="sub" x="1110" y="416">rag_meta</text>
  <text class="mono" x="1110" y="442">snapshot registry</text>
  <text class="mono" x="1110" y="464">indexer status</text>
  <line x1="1022" y1="488" x2="1198" y2="488" stroke="#35c7b1" stroke-opacity=".2"/>
  <text class="sub" x="1110" y="520">rag_state</text>
  <text class="mono" x="1110" y="546">audit log</text>

  <path class="blue-line" d="M250 230H370"/>
  <path class="blue-line" d="M600 230H690"/>
  <path class="blue-line" d="M900 230H990"/>
  <text class="edge-label" x="310" y="207">HTTP :8080</text>
  <text class="edge-label" x="645" y="207">/chat</text>
  <text class="edge-label" x="945" y="207">search</text>
  <text class="edge-label" x="945" y="258">read-only</text>

  <rect class="node archive" x="50" y="465" width="260" height="110" rx="17"/>
  <text class="label" x="180" y="512">Transcript archive</text>
  <text class="sub" x="180" y="548">Git repository</text>

  <rect class="node" x="400" y="465" width="230" height="110" rx="17"/>
  <text class="label" x="515" y="512">Indexer</text>
  <text class="sub" x="515" y="548">scan · chunk · embed</text>

  <path class="teal-line" d="M310 520H400"/>
  <path class="teal-line" d="M630 520H990"/>
  <text class="edge-label" x="355" y="497">pull</text>
  <text class="edge-label" x="810" y="497">build · publish snapshot</text>
  <text class="edge-label" x="810" y="548">atomic · reversible</text>
</svg>
