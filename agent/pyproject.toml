[project]
name = "bedtimenews-agent"
version = "0.5.4"
description = "Agentic RAG retrieval API for Bedtime News"
requires-python = "==3.14.*"
dependencies = [
    # Web Framework
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    # Database
    "psycopg2-binary>=2.9.11",
    # LangChain
    "langchain-core>=1.7.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2",
    # Retry logic (imported directly by retriever.py)
    "tenacity>=9.1.4",
    # Validation & Config
    "pydantic>=2.13.5",
    "pydantic-settings[yaml]>=2.10.1",
    "jieba==0.42.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Dependency-only project: application code is run from ./src at runtime,
# not installed as a package, so disable package discovery.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
# Run from this component dir (`cd agent && pytest`) so its `src` namespace
# is the only one on the path — agent/ and indexer/ both define `src.*`.
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
