# Top-level uv workspace root.
#
# This is a virtual project (not built or installed itself). It exists to:
#   1. tie the three deployable components together as a uv workspace, so the
#      whole repo installs into one local env with a single `uv sync`, and
#   2. hold shared dev/CI tooling (the `dev` group) and tool config (ruff).
#
# Each component (agent, indexer, frontend) keeps its own self-contained
# pyproject.toml and is still built independently by Docker via `pip install .`.
# Runtime Python is the 3.15 series. `requires-python` is `==3.15.*`, which
# accepts 3.15.0rc3 now and 3.15.0 once it is released. Images currently use
# `python:3.15-rc-slim`. Switch that tag to `python:3.15-slim`, and
# `.python-version` from `3.15.0rc3` to `3.15`, when the stable image exists.
#
#   uv sync                      # all components (editable) + dev tooling
#   uv run ruff check .          # lint
#   uv run ruff format .         # format

[project]
name = "bedtimenews"
version = "0.4.2"
requires-python = "==3.15.*"
dependencies = [
    "bedtimenews-agent",
    "bedtimenews-indexer",
    "bedtimenews-frontend",
    # Direct so the git source below applies. PyPI 1.12.2 cannot build on 3.15.
    "ormsgpack",
]

[dependency-groups]
# Dev/CI tooling shared across all components. Deliberately NOT installed in
# any Docker image — linting/formatting/testing are not runtime dependencies.
dev = [
    "ruff>=0.16.10",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false # virtual root: don't build/install this project itself

[tool.uv.workspace]
members = ["agent", "indexer", "frontend"]

[tool.uv.sources]
bedtimenews-agent = { workspace = true }
bedtimenews-indexer = { workspace = true }
bedtimenews-frontend = { workspace = true }
# PyPI ormsgpack 1.12.2 builds with PyO3 0.27, which rejects Python 3.15.
# This revision is still 1.12.2 and uses PyO3 0.29. Drop it once a release
# ships a cp315 wheel. `pip` does not read this table.
ormsgpack = { git = "https://github.com/ormsgpack/ormsgpack.git", rev = "177a74fbf82ec5f517b276032b41a61b3323fc22" }

[tool.ruff]
target-version = "py315"
line-length = 88
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "F", "I", "W", "UP", "B"]
# `ruff format` owns code line length (88); the remaining E501 hits are all
# long string literals (prompts, SQL, docstrings) the formatter won't wrap.
ignore = ["E501"]
