services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: bedtimenews-postgres
    # Parallel HNSW index builds (every snapshot build) allocate their working
    # memory in /dev/shm, ~265 MB for the full corpus; Docker's 64 MB default
    # fails them with "could not resize shared memory segment". A ceiling, not
    # a reservation: the memory is only used while an index is being built.
    shm_size: 1g
    env_file: .env
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - ${POSTGRES_DATA_DIR:-./storage/postgres/volume}:/var/lib/postgresql
      # init.sh only enables pgvector, on first init of an empty data volume.
      # All RAG schemas (rag_meta, rag_state, the rag_s<id> snapshots) and the
      # read-only rag_agent role are created by the indexer.
      - ./storage/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user} -d ${POSTGRES_DB:-postgres_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bedtimenews_net

  # App services carry both `image:` and `build:`, and `image:` is what decides
  # what runs. `docker compose up` never builds on its own: it reuses the tagged
  # image if it is already local, otherwise it PULLS the published one from GHCR
  # — even from a source checkout, and even with local edits. Use
  # `docker compose up --build` (or `docker compose build`) to run your own code.
  # Pin a published version with IMAGE_TAG in .env (default: latest).
  indexer:
    image: ghcr.io/bedtimenewsstudio/bedtimenews-agent-indexer:${IMAGE_TAG:-latest}
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: bedtimenews-indexer
    # On stop, the indexer cancels a running build; Postgres rolls the build
    # transaction back, so nothing half-built is left behind.
    stop_grace_period: 30s
    environment:
      # App settings come from config.yml (mounted read-only below); the
      # environment only relocates the file and wires deployment paths.
      CONFIG_YAML: /run/config/config.yml
      INDEX_CONFIG_FILE: /app/index_config.yml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read-only rag_agent role: created by the indexer; LOGIN only when set.
      POSTGRES_AGENT_PASSWORD: ${POSTGRES_AGENT_PASSWORD:-}
      # Dimension of the vector space snapshots are built in.
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
    volumes:
      - ./config.yml:/run/config/config.yml:ro
      - ${INDEXER_DATA_DIR:-./indexer/data}:/data
      - bedtimenews_indexer_logs:/var/log/indexer
      # Read-only view of the Postgres data directory, used only to check free
      # disk space before a build (a full disk would take the database down).
      - ${POSTGRES_DATA_DIR:-./storage/postgres/volume}:/pgdata:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bedtimenews_net

  agent:
    image: ghcr.io/bedtimenewsstudio/bedtimenews-agent-agent:${IMAGE_TAG:-latest}
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: bedtimenews-agent
    environment:
      CONFIG_YAML: /run/config/config.yml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      # Set -> connect as the read-only rag_agent role. Unset -> fall back to
      # the superuser below (logged as a warning).
      POSTGRES_AGENT_PASSWORD: ${POSTGRES_AGENT_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Query-vector dimension; with embedding.model it names the vector space
      # a snapshot must be in for this agent to read it.
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2560}
      # Optional: pin one snapshot id instead of following the newest one.
      RAG_SNAPSHOT: ${RAG_SNAPSHOT:-}
    volumes:
      - ./config.yml:/run/config/config.yml:ro
      - bedtimenews_agent_logs:/var/log/agent
    # Ready = database reachable and a readable snapshot selected (/health).
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bedtimenews_net

  # The stack serves plain HTTP on FRONTEND_PORT (default 8080) — no TLS.
  # Public exposure and TLS termination are handled outside this repo.
  web:
    image: ghcr.io/bedtimenewsstudio/bedtimenews-agent-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bedtimenews-web
    environment:
      # Shown in the masthead. IMAGE_TAG is what actually got deployed, so it
      # beats whatever version the source tree happens to declare.
      - APP_VERSION=${IMAGE_TAG:-}
      - AGENT_BACKEND_HOST=agent
      - AGENT_BACKEND_PORT=8000
      - PUBLIC_BASE_URL=https://bedtime.blog
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - bedtimenews_net

volumes:
  bedtimenews_indexer_logs:
    driver: local
  bedtimenews_agent_logs:
    driver: local

networks:
  bedtimenews_net:
    driver: bridge
