# ============================================================================
# Umbrella file for self-hosting and local development: the whole stack in one
# project, exactly as before the split.
#
#   docker compose up -d            # needs Docker Compose 2.24.6+ (see README)
#
# The stack is two layers (docs/designs/20261008_blue-green-deployment.md):
#   compose.data.yml   postgres + indexer, upgraded in place
#   compose.app.yml    agent + web, one project per instance
# Production does not use this file: it calls the two layers with `-p` and
# `-f`, and its .env sets COMPOSE_FILE=compose.data.yml so that a
# `docker compose` without `-f` only ever touches the data layer.
#
# Overrides still work on top of this file, e.g.
#   docker compose -f docker-compose.yml -f docker-compose.sample.yml up -d
# ============================================================================
include:
  - compose.data.yml
  - compose.app.yml
