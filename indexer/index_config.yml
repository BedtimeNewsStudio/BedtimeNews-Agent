# RAG Indexer Configuration
# Selects which files of BedtimeNews-Transcripts get indexed.
#
# Patterns are matched against a document's URI — its path relative to
# contents/, including the .md suffix (e.g. ShuiQianXiaoXi/0501-0600/0588.md).

# Include patterns (processed first)
include:
  # 睡前消息
  - ShuiQianXiaoXi/*/*.md

  # 参考信息
  - CanKaoXinXi/*/*.md

  # 高见
  - GaoJian/*/*.md

  # 讲点黑话
  - JiangDianHeiHua/*/*.md

  # 产经破壁机
  # 2026-09 起该栏目改用发布日期命名，文稿直接位于栏目根目录。
  - ChanJingPoBiJi/*.md

  # 编号期（历史路径）与 misc/ 特辑仍为两级路径。
  - ChanJingPoBiJi/*/*.md

# Exclude patterns (processed after include)
exclude:
  # Per-channel navigation pages, not transcripts.
  - "*/INDEX.md"

# File validation rules
validation:
  # Minimum file size in bytes (skip empty or tiny files)
  min_file_size: 100

  # Maximum file size in bytes (skip extremely large files)
  max_file_size: 10485760 # 10 MB
