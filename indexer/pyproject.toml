[project]
name = "bedtimenews-indexer"
version = "0.1.3"
description = "Index pipeline for Bedtime News"
requires-python = ">=3.12"
dependencies = [
    # Scheduling
    "croniter>=6.0.0",
    # Database
    "psycopg2-binary>=2.9.12",
    # Embeddings
    "openai>=3.8.0",
    "tiktoken>=0.13.0",
    "tenacity>=9.1.4",
    # Config
    "PyYAML>=6.0.3",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

# Dependency-only project: application code is run from ./src at runtime,
# not installed as a package, so disable package discovery.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
# Run from this component dir (`cd indexer && pytest`) so its `src` namespace
# is the only one on the path — agent/ and indexer/ both define `src.*`.
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
